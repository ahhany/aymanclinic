name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare dev database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci.db
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
